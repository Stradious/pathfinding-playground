<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pathfinding Playground</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e5e7eb;background:#0a1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 18px;background:radial-gradient(circle at 70% 0%,#172c48,#0a1020 55%)}main{max-width:1080px;margin:auto}h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 8px}p{color:#aab8ca;line-height:1.5}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}button,select{background:#1e3049;color:#fff;border:1px solid #426280;border-radius:9px;padding:10px 13px;font:inherit;cursor:pointer}button:hover,select:hover{background:#2c4668}button.active,#run{background:#06b6d4;color:#04111d;border-color:#06b6d4;font-weight:700}button:disabled{opacity:.5;cursor:wait}.board-wrap{overflow:auto;border:1px solid #2d4660;border-radius:14px;padding:12px;background:#101b2e}.board{display:grid;grid-template-columns:repeat(24,minmax(20px,1fr));gap:3px;min-width:720px;touch-action:none}.cell{aspect-ratio:1;border-radius:3px;background:#25344d;cursor:crosshair}.cell.wall{background:#090e19}.cell.visited{background:#215d83}.cell.path{background:#f7c948}.cell.start{background:#35d49d}.cell.goal{background:#fa6b7b}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;color:#b7c7d8}.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}.swatch{width:13px;height:13px;border-radius:3px;display:inline-block}
  </style>
</head>
<body><main><h1>Pathfinding Playground</h1><p>Draw walls, place the endpoints, then compare how A* and Dijkstra explore the grid.</p><div class="toolbar"><select id="algorithm" aria-label="Algorithm"><option value="astar">A* search</option><option value="dijkstra">Dijkstra</option></select><button class="active" data-tool="wall">Draw walls</button><button data-tool="erase">Erase</button><button data-tool="start">Move start</button><button data-tool="goal">Move goal</button><button id="random">Random walls</button><button id="clear">Clear walls</button><button id="run">Find path</button></div><div class="board-wrap"><div id="board" class="board" aria-label="Pathfinding grid"></div></div><div class="meta"><div id="status" role="status">Ready to explore.</div><div class="legend"><span><i class="swatch" style="background:#35d49d"></i>Start</span><span><i class="swatch" style="background:#fa6b7b"></i>Goal</span><span><i class="swatch" style="background:#215d83"></i>Visited</span><span><i class="swatch" style="background:#f7c948"></i>Path</span></div></div></main><script type="module" src="./app.mjs"></script></body></html>
